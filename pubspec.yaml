name: metastrip
description: Metadata Viewer & Remover — strip the invisible, own your files.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Local Storage
  shared_preferences: ^2.3.1
  path_provider: ^2.1.3

  # File Operations
  file_picker: ^8.0.6
  path: ^1.9.0
  mime: ^1.0.5
  archive: ^3.6.0

  # Metadata — Images
  exif: ^3.3.0
  image: ^4.2.0

  # UI / Design
  lucide_icons_flutter: ^1.0.1
  flutter_colorpicker: ^1.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utilities
  crypto: ^3.0.3
  convert: ^3.1.1
  intl: ^0.19.0

  # Directory picker
  file_selector: ^1.0.3

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  
